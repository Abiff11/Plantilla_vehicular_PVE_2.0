services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      HOST: ${HOST:-0.0.0.0}
      TRUST_PROXY: ${TRUST_PROXY:-false}

      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: ${DATABASE_SSL:-true}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80,http://localhost:5173,http://127.0.0.1:5173}

      SUPERADMIN_FIRST_NAME: ${SUPERADMIN_FIRST_NAME}
      SUPERADMIN_LAST_NAME: ${SUPERADMIN_LAST_NAME}
      SUPERADMIN_GRADE: ${SUPERADMIN_GRADE:-N/A}
      SUPERADMIN_PHONE: ${SUPERADMIN_PHONE}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}

      SEED_USERS_PASSWORD: ${SEED_USERS_PASSWORD:-123456789}

      STORAGE_DRIVER: ${STORAGE_DRIVER:-r2}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    ports:
      - "3101:3101"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3101/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:3101}
    ports:
      - "3101:3000"
    depends_on:
      - backend
    restart: unless-stopped
