name: Apply free-text adscription

on:
  push:
    branches:
      - feat/free-text-adscription

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/free-text-adscription
          fetch-depth: 0

      - name: Apply source changes
        run: python3 scripts/apply-free-text-adscription.py

      - name: Remove temporary patch files
        run: |
          rm scripts/apply-free-text-adscription.py
          rm .github/workflows/apply-free-text-adscription.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend checks
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: permitir adscripción libre normalizada"
          git push origin HEAD:feat/free-text-adscription
