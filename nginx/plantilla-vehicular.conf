limit_req_zone $binary_remote_addr zone=plantilla_vehicular_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=plantilla_vehicular_auth:10m rate=5r/m;

upstream plantilla_vehicular_frontend {
    server plantilla-vehicular-frontend-1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name plantilla.sisoaxaca.com;

    client_max_body_size 15M;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location /api/auth/ {
        limit_req zone=plantilla_vehicular_auth burst=10 nodelay;
        proxy_pass http://plantilla_vehicular_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        limit_req zone=plantilla_vehicular_general burst=50 nodelay;
        proxy_pass http://plantilla_vehicular_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
